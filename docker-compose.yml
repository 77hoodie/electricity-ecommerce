services:
  postgres:
    image: postgres:16-alpine
    container_name: electricity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: electricity
    ports:
      - "5433:5432"
    volumes:
      - electricity_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d electricity"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  electricity_postgres_data:
